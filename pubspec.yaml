name: flag_game_atlas
description: Um jogo de bandeiras em Flutter para a Atividade 03 de PDM.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/countries.json
    - assets/flags/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

